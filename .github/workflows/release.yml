name: release

# Create a GitHub Release with the workflow token. This removes the manual
# "no gh/token on the laptop" step: the repository itself has contents: write.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tarball and checksum
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Create Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          NOTES="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing $NOTES" >&2
            exit 1
          fi
          gh release create "$TAG" ./*.tgz SHA256SUMS \
            --title "Group-Chat ${TAG#v}" \
            --notes-file "$NOTES" \
            --verify-tag
